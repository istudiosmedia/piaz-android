# F-Droid build recipe. Submit as a merge request to https://gitlab.com/fdroid/fdroiddata (metadata/news.piaz.yml).
AntiFeatures:
  NonFreeNet:
    en-US: Videos play from YouTube and live TV streams come from third-party broadcasters.
Categories:
  - Multimedia
  - Reading
License: GPL-3.0-only
AuthorName: IStudios Media LLC
WebSite: https://piaz.news
SourceCode: https://github.com/istudiosmedia/piaz-android
IssueTracker: https://github.com/istudiosmedia/piaz-android/issues
Changelog: https://github.com/istudiosmedia/piaz-android/releases

AutoName: The Piaz

RepoType: git
Repo: https://github.com/istudiosmedia/piaz-android.git

Builds:
